# MongoDB local para desarrollo:  docker compose up -d
# (alternativa: usar un clúster gratuito de MongoDB Atlas y poner su URI en server/.env)
services:
  mongo:
    image: mongo:7
    container_name: prestamas-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"   # expuesto solo en localhost
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
